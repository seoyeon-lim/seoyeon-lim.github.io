{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- font sizing to match clean academic style -->
<style>
  .page__content { font-size: 0.88em; }
  .page__content h2 { font-size: 1em; }
  .page__content h4 { font-size: 1em; font-weight: bold; border-bottom: 1px solid var(--global-border-color); padding-bottom: 0.3em; margin-top: 1.5em; }
  .page__title { font-size: 1.4em !important; }
  .page__content a { text-decoration: none; }
  .page__content a:hover { color: var(--global-base-color); text-decoration: none; }
  .masthead::after {
    background: linear-gradient(to right, var(--global-bg-color), var(--global-base-color), var(--global-bg-color)) !important;
  }
  .author__bio { color: #8090a8; }
  .author__avatar img { border: 1px solid var(--global-base-color) !important; }
  .page__footer {
    border-top: 1px solid var(--global-base-color);
  }
</style>

<!-- end custom head snippets -->
